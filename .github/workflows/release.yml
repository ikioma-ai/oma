name: Release

permissions: {}

on:
  push:
    tags: [ "v*" ]

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      packages: read

  release:
    needs: [ci]
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 # zizmor: ignore[cache-poisoning] -- cache is branch-isolated; fork PRs cannot write to this cache
      with:
        go-version-file: go.mod

    - name: Build release artifacts
      run: make dist

    - name: Verify release artifacts
      run: |
        set -eu
        cd dist
        sha256sum -c checksums.txt
        for asset in oma-linux-amd64 oma-linux-arm64 oma-darwin-amd64 oma-darwin-arm64; do
          grep -q "  ${asset}$" checksums.txt
        done

    - name: Sign release artifacts
      env:
        RELEASE_SIGNING_KEY: ${{ secrets.OMA_RELEASE_SIGNING_KEY }}
      run: |
        set -eu
        printf '%s' "$RELEASE_SIGNING_KEY" > "$RUNNER_TEMP/release-signing-key.pem"
        openssl dgst -sha256 -sign "$RUNNER_TEMP/release-signing-key.pem" -out dist/checksums.txt.sig dist/checksums.txt
        openssl pkey -in "$RUNNER_TEMP/release-signing-key.pem" -pubout -out "$RUNNER_TEMP/release-signing-key.pub.pem"
        openssl dgst -sha256 -verify "$RUNNER_TEMP/release-signing-key.pub.pem" -signature dist/checksums.txt.sig dist/checksums.txt
        printf '%s\n' 'oma-release-2026-10' > dist/checksums.txt.keyid
        rm -f "$RUNNER_TEMP/release-signing-key.pem"

    - name: Set release metadata
      id: release
      env:
        TAG: ${{ github.ref_name }}
        OWNER: ${{ github.repository_owner }}
      run: |
        set -eu
        image="ghcr.io/$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')/oma-installer-service"
        case "$TAG" in
          *-*) prerelease=true ;;
          *) prerelease=false ;;
        esac
        {
          echo "image=$image"
          echo "prerelease=$prerelease"
          echo "tags<<EOF"
          echo "$image:$TAG"
          if [ "$prerelease" = "false" ]; then
            echo "$image:latest"
          fi
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Set up QEMU
      uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      with:
        platforms: arm64

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

    - name: Log in to GHCR
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push installer image
      id: image
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: installer
        file: installer/Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.release.outputs.tags }}

    - name: Write release notes
      env:
        TAG: ${{ github.ref_name }}
        IMAGE: ${{ steps.release.outputs.image }}
        DIGEST: ${{ steps.image.outputs.digest }}
        PRERELEASE: ${{ steps.release.outputs.prerelease }}
      run: |
        set -eu
        cat > "$RUNNER_TEMP/release-notes.md" <<EOF
        ## Oma ${TAG}

        ### Binaries

        - \`oma-linux-amd64\`
        - \`oma-linux-arm64\`
        - \`oma-darwin-amd64\`
        - \`oma-darwin-arm64\`

        Checksums are published in \`checksums.txt\`, with signer key ID in \`checksums.txt.keyid\`.

        ### Installer image

        \`${IMAGE}:${TAG}\`

        Digest: \`${DIGEST}\`

        Signature: \`checksums.txt.sig\` (key \`oma-release-2026-10\`)

        ### Validation

        Automated checks passed. Clean-host, VPS, LAN, and controller-only acceptance results are tracked in \`docs/release/slices.md\`.

        Pre-release: \`${PRERELEASE}\`
        EOF

    - name: Create release
      env:
        GH_TOKEN: ${{ github.token }}
        PRERELEASE: ${{ steps.release.outputs.prerelease }}
      run: |
        set -eu
        prerelease_args=""
        if [ "$PRERELEASE" = "true" ]; then
          prerelease_args="--prerelease"
        fi
        gh release create "${GITHUB_REF_NAME}" \
          dist/* \
          --title "Release ${GITHUB_REF_NAME}" \
          --notes-file "$RUNNER_TEMP/release-notes.md" \
          $prerelease_args
